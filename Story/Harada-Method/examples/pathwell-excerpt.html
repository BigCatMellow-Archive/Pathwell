<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Pathwell Harada Chart (excerpt)</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Harada chart viewer (Story/Harada-Method). Layout: an Open Window 64 sheet on archival board, recursive. Whatever box is the center, its eight sit around it and each of those sits at the heart of its own block with its own eight. Any box can become the center. Detail panel beside on wide screens; outline view on phones. */
:root{
  --bg:#E9EEF0; --paper:#FBFCFC; --ink:#1C2733; --muted:#5A6873; --rule:#C6D0D6; --rule-soft:#DCE3E7;
  --marker:#1E4DA6; --marker-wash:#E3EAF8; --on-marker:#FBFCFC;
  --paid:#2C7A58; --paid-wash:#E2F1EA; --thin:#A86A12; --thin-wash:#FBEFD9; --open:#66737E; --open-wash:#EEF1F3; --author:#7444AD; --author-wash:#EFE6FA; --danger:#B03A2E;
  --f-hand:"Kalam","Comic Neue","Segoe Print",cursive;
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-quote:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161B; --paper:#192129; --ink:#E2E8EC; --muted:#93A1AB; --rule:#2E3A44; --rule-soft:#24303A;
  --marker:#86A9F2; --marker-wash:#1E2A40; --on-marker:#0F1520;
  --paid:#5FC69A; --paid-wash:#16302A; --thin:#E3AA4E; --thin-wash:#33281A; --open:#94A0AA; --open-wash:#222B33; --author:#BC98EA; --author-wash:#2C2240; --danger:#EE8A7E;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161B; --paper:#192129; --ink:#E2E8EC; --muted:#93A1AB; --rule:#2E3A44; --rule-soft:#24303A;
  --marker:#86A9F2; --marker-wash:#1E2A40; --on-marker:#0F1520;
  --paid:#5FC69A; --paid-wash:#16302A; --thin:#E3AA4E; --thin-wash:#33281A; --open:#94A0AA; --open-wash:#222B33; --author:#BC98EA; --author-wash:#2C2240; --danger:#EE8A7E;
  color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
.wrap{max-width:1340px;margin:0 auto;padding-block:26px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:4px 0 0;font-size:clamp(24px,3.2vw,34px);line-height:1.15;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.lede{margin:6px 0 0;color:var(--muted);max-width:66ch}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;color:inherit}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{padding:7px 14px;font-size:13px;background:transparent;border:0;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn{font-size:13px;padding:7px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);cursor:pointer}
.btn.primary{background:var(--marker);border-color:var(--marker);color:var(--on-marker);font-weight:600}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px;min-width:0}
.crumbs button{background:none;border:0;padding:3px 6px;border-radius:5px;cursor:pointer;color:var(--marker);font-weight:500}
.crumbs button:hover{background:var(--marker-wash)}
.crumbs .here{padding:3px 6px;font-weight:700}
.crumbs .sep{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--rule);border-radius:999px;background:var(--paper);font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.dot.paid{background:var(--paid)} .dot.thin{background:var(--thin)} .dot.open{background:transparent;border:1.5px dashed var(--open)} .dot.author{background:var(--author)}
button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--marker);outline-offset:2px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}}
.board{overflow-x:auto;padding-bottom:4px}
.sheet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;min-width:980px;background:var(--rule);padding:9px;border-radius:6px}
.block{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;background:var(--rule-soft)}
.cell{position:relative;background:var(--paper);min-height:98px;padding:8px 8px 22px;display:flex;flex-direction:column;gap:4px;cursor:pointer;border:0;text-align:left;transition:opacity .15s,background .15s}
.cell:hover{background:var(--marker-wash)}
.cell .ch{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em;padding-right:14px}
.cell .lbl{font-size:12.5px;line-height:1.3;font-weight:500;overflow-wrap:anywhere;padding-right:12px}
.cell .st{position:absolute;top:9px;right:8px}
.cell .inside{position:absolute;left:8px;bottom:6px;display:inline-flex;gap:5px;align-items:center;font-family:var(--f-mono);font-size:10px;color:var(--marker);letter-spacing:.03em}
.cell .inside .dot{width:7px;height:7px}
.cell.hub{background:var(--marker-wash)}
.cell.hub .lbl{font-family:var(--f-hand);font-weight:700;font-size:15px;line-height:1.15;color:var(--marker)}
.cell.hub .ch{color:var(--marker)}
.cell.char .ch{color:var(--author);font-weight:600}
.cell.focus{background:var(--marker);justify-content:center;cursor:default}
.cell.focus .lbl{font-family:var(--f-hand);font-weight:700;font-size:16px;line-height:1.2;color:var(--on-marker)}
.cell.focus .ch,.cell.focus .inside{color:var(--on-marker);opacity:.85}
.cell.empty{background:transparent;cursor:default;min-height:98px}
.cell.empty.addable{cursor:pointer;border:1.5px dashed var(--rule);background:var(--paper);align-items:center;justify-content:center;color:var(--muted);font-size:12.5px;padding:8px}
.cell.thin{box-shadow:inset 0 -3px 0 var(--thin)}
.cell.author{box-shadow:inset 0 -3px 0 var(--author)}
.cell.dim{opacity:.28}
.cell.sel{outline:2px solid var(--ink);outline-offset:-2px;z-index:1}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow:auto}
@media (max-width:1100px){.panel{position:static;max-height:none}}
.panel h2{margin:0;font-size:19px;line-height:1.25;text-wrap:balance}
.panel .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-ui);font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.paid{background:var(--paid-wash);color:var(--paid)} .pill.thin{background:var(--thin-wash);color:var(--thin)} .pill.open{background:var(--open-wash);color:var(--open)} .pill.author{background:var(--author-wash);color:var(--author)}
blockquote{margin:0;padding:10px 14px;border-left:3px solid var(--marker);background:var(--bg);font-family:var(--f-quote);font-style:italic;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.proposed{border-left-color:var(--author);font-style:normal}
.proposed::before{content:"Proposed wording · not in the source yet";display:block;font-family:var(--f-mono);font-style:normal;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--author);margin-bottom:4px}
.panel p{margin:0}
.how{display:flex;flex-direction:column;gap:5px}
.muted{color:var(--muted)}
.tally{display:flex;flex-wrap:wrap;gap:6px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.hint{font-size:12.5px;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--rule-soft);padding-top:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.form input,.form textarea,.form select{font:inherit;font-size:14px;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:7px 9px;width:100%;box-sizing:border-box}
.form textarea{min-height:64px;resize:vertical}
.form .row2{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px}
.notice{font-size:13px;padding:8px 10px;border-radius:6px;background:var(--author-wash);color:var(--ink)}
.notice.err{background:var(--thin-wash)}
/* outline */
.outline{display:flex;flex-direction:column;gap:10px}
.outline details{border-left:1px solid var(--rule);margin-left:6px;padding-left:10px}
.outline > details{background:var(--paper);border:1px solid var(--rule);border-radius:8px;margin:0;padding:4px 12px 8px}
.outline summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:7px 0}
.outline summary::-webkit-details-marker{display:none}
.outline summary .ch{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.outline summary .t{font-weight:500;min-width:0;overflow-wrap:anywhere}
.outline summary .t small{font-family:var(--f-mono);font-size:10.5px;color:var(--marker);margin-left:6px;font-weight:500}
.outline .body{display:flex;flex-direction:column;gap:6px;padding:0 0 8px 52px}
.outline .body .note{font-size:13px;color:var(--muted)}
.outline .leaf{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:7px 0 7px 0;border-left:1px solid var(--rule);margin-left:6px;padding-left:10px}
.outline .dim{opacity:.3}
.outline .goal{background:var(--marker);color:var(--on-marker);border-radius:8px;padding:14px 16px}
.outline .goal b{font-family:var(--f-hand);font-size:21px;display:block;line-height:1.2}
.loose{background:var(--paper);border:1px dashed var(--rule);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.loose h3{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.loose ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.loose li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline;font-size:13.5px}
.loose .id{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);min-width:78px;display:inline-flex;gap:6px;align-items:center}
footer{font-size:12.5px;color:var(--muted);max-width:84ch}
@media (prefers-reduced-motion:reduce){.cell{transition:none}}
</style>

<script>
const DATA = {"title":"Pathwell Harada Chart (excerpt)","lede":"A limited worked example from the current Pathwell chart. The center is a working statement grounded in the author’s existing controlling idea, not final author-approved wording; the nodes show how evidence can support or challenge a parent's claim.","footer":"Excerpted from the current, 18-chapter source-checked Pathwell Harada chart. The full chart, not this subset, owns the actual reading of the novel.","labels":{"center":"Proposed controlling message","centerNote":"How the whole story argues this","source":"Ch","sourceName":"Chapter"},"root":{"title":"Control is not competence; others pay when you decide for them.","ch":18,"quote":"Are you ready?","note":"WORKING THEMATIC CENTRE, not yet author-approved wording. This is grounded in the authoritative Thesis-and-Controlling-Ideas: Pathwell confuses the power to intervene and pay with the right to determine another person's life; the magic literally consumes human histories and possible futures. Elizabeth acts without magic, accepts loss and eventually makes an invitation rather than taking charge of Pathwell's answer. Shade's refusal is valid even though a cleanup creature kills him anyway; consent is not a guarantee of survival. Stansbury and Camp offer qualified counterexamples, and Pathwell's delayed confession/restitution change his conduct without restoring Shade or earning automatic pardon. The opening and closing 'Ready? / No. / Perfect.' exchange changes from overridden objection to chosen, mutually accepted movement; it does not erase the difference between being unready and unwilling. These are tested readings of Chapters 1, 3–4, 7–18, not a moral uttered by the characters.","kids":[{"title":"Elizabeth becomes the author of her own decisions","kind":"character","note":"She resists from Chapter 1, but her objections do not determine what happens while others control the facts, danger and her property. Her agency grows through particular imperfect and costly decisions—forest, cookbook, car, accusation, diary, rescue—and ends in an invitation that leaves Pathwell free to answer. Her significance never depends on a magical gift, being a chosen target or guaranteeing a perfect outcome.","kids":[{"title":"Start: Elizabeth resists before anyone listens","note":"The first chapter does not show a woman who simply complies. She objects to a stranger reading her diary, asks questions, takes back the cookbook, says she will not go and answers 'No' to being ready. The danger, withheld information and Pathwell's physical hand nevertheless determine the departure. Her later arc is from resistance with little effective control toward informed self-direction, not from a total absence of will.","kids":[{"title":"Three weeks in, nothing unpacked","ch":2,"quote":"Three weeks. Twenty-one days of unpacked boxes and takeout trying to figure out what came next.","status":"paid","note":"A new life she hasn't moved into yet.","kids":[],"id":"p1-1-1"},{"title":"She left because staying felt worse","ch":2,"quote":"A life she'd packed into garbage bags and moved across the city because staying felt worse than leaving, but leaving didn't feel like anything at all.","status":"paid","note":"Her real problem, said once, in her own breakdown.","kids":[],"id":"p1-1-2"},{"title":"Nobody at work has noticed her","ch":1,"quote":"He'd laughed at her joke about the landlord, which was more than anyone from work had managed.","status":"paid","note":"The stranger going through her boxes is the one person at her party who laughed.","kids":[],"id":"p1-1-3"}],"id":"p1-1"},{"title":"Wants: her books back, then the truth","note":"What she's after changes as she climbs. Each want is a little more her own than the one before.","kids":[{"title":"Nana's cookbook back","ch":2,"quote":"He still has it.","status":"paid","note":"Ch2–3. Property, not trust.","kids":[],"id":"p1-2-1"},{"title":"Answers before she goes anywhere","ch":3,"quote":"I'm not going anywhere without getting some questions answered.","status":"paid","kids":[],"id":"p1-2-2"},{"title":"To know why it came to her door","ch":4,"quote":"She wanted to know why something impossible had come through her door before the magic went wrong.","status":"paid","note":"The first want that isn't about getting something back.","kids":[],"id":"p1-2-3"}],"id":"p1-2"},{"title":"Needs: to direct herself without controlling everyone else","note":"She already resists, so the unmet need is not to discover she can say no; it is to obtain enough truth, set terms, act despite uncertainty and own the consequences. Her best choices involve limits: she cannot rescue everyone or recover destroyed originals.","kids":[{"title":"Nobody is going to make her important","ch":9,"quote":"Then you were never the point.","status":"paid","note":"The diner takes away the importance Pathwell gave her by mistake.","kids":[],"id":"p1-3-1"},{"title":"She has to make herself the driver","ch":8,"quote":"Elizabeth chose the ditch.","status":"paid","kids":[],"id":"p1-3-2"},{"title":"She has to say no and mean it","ch":11,"quote":"I don't need to be rescued.","status":"paid","kids":[],"id":"p1-3-3"}],"id":"p1-3"},{"title":"Stands for: human worth without magical exceptionalism","note":"She owns ordinary decisions and acts with an injured body, not an undiscovered magical power. The dagger is Stansbury's enchantment; the Camp fire rescue works without it. She matters neither because she was the blob's target nor because her choice causes a magically favorable outcome.","kids":[{"title":"She never does magic","status":"paid","note":"Canon hard boundary. She can own, carry, give, or position charged things. She can't use them.","kids":[],"id":"p1-4-1"},{"title":"Ordinary people feel the magic too","ch":3,"quote":"None of that had been hers, and she held on to that.","status":"paid","note":"Her overwhelm in the Space Between isn't a hidden gift.","kids":[],"id":"p1-4-2"},{"title":"The dagger is Stansbury's magic, her choice","ch":7,"quote":"Elizabeth already had the dagger in her hand.","status":"paid","kids":[],"id":"p1-4-3"}],"id":"p1-4"},{"title":"In her way: withheld facts, imposed decisions, and attachment","note":"Elizabeth is not passively allowing everything. Pathwell, the brothers' evasions, the danger, her possessions and her desire for an explanation keep narrowing the real options she can see. Her decisions become more informed even when they remain costly or wrong.","kids":[{"title":"He decides the danger is hers","ch":1,"quote":"Your house has now been marked, magically speaking.","status":"paid","kids":[],"id":"p1-5-1"},{"title":"He offers a choice while holding her things","ch":2,"quote":"The choice is yours, Lizzy.","status":"paid","kids":[],"id":"p1-5-2"},{"title":"He answers for her","ch":4,"quote":"Pathwell answered for her. \"No.\"","status":"paid","kids":[],"id":"p1-5-3"}],"id":"p1-5"},{"title":"Arc: resisting, choosing, losing, and choosing again","note":"Each rung has an independent cause and cost. The ditch is a deliberate dangerous act, not automatically a wise one. Saving Milo while Shade struggles is an urgent choice under incompatible demands, not evidence that Shade deserved less. The final invitation is a new possibility, not a verdict of innocence.","kids":[{"title":"She follows him for her books","ch":2,"quote":"He still has it.","status":"paid","note":"Rung 1: she stops absorbing what happened and goes after something that's hers.","kids":[{"title":"He tells her it's her choice","ch":2,"quote":"The choice is yours, Lizzy.","status":"paid","note":"He's holding her books while he says it.","kids":[],"id":"p1-6-1-1"},{"title":"He leaves her alone in the neon","ch":2,"quote":"She watched him walk off, leaving her in the red neon glow.","status":"paid","kids":[],"id":"p1-6-1-2"},{"title":"Nana's name brings the warmth back","ch":2,"quote":"Then a warmth, the taste of butter and sugar","status":"paid","note":"R21: the echo of Nana's voice through the page.","kids":[],"id":"p1-6-1-3"},{"title":"She looks for the books and they're gone","ch":2,"quote":"Her eyes swept the table, slowly at first. Then darting.","status":"paid","kids":[],"id":"p1-6-1-4"},{"title":"She runs after him","ch":2,"quote":"He still has it.","status":"paid","kids":[],"id":"p1-6-1-5"},{"title":"She steps through for the books, not for him","ch":3,"quote":"He still had her books.","status":"paid","kids":[],"id":"p1-6-1-6"}],"id":"p1-6-1"},{"title":"She chooses the forest over the sidewalk","ch":4,"quote":"She had put them there herself, after the shopkeeper had offered to send her back to the sidewalk.","status":"paid","note":"Rung 2: the first choice she makes with her books back in her hands (R31).","kids":[{"title":"The shop gives her books back, not him","ch":3,"quote":"These were never his to spend.","status":"paid","kids":[],"id":"p1-6-2-1"},{"title":"She's offered a way home","ch":4,"quote":"after the shopkeeper had offered to send her back to the sidewalk.","status":"paid","kids":[],"id":"p1-6-2-2"},{"title":"She puts her books on his cart herself","ch":4,"quote":"She had put them there herself","status":"paid","kids":[],"id":"p1-6-2-3"},{"title":"It still feels strange to her","ch":4,"quote":"That fact still felt strange enough to keep checking.","status":"paid","kids":[],"id":"p1-6-2-4"},{"title":"She goes on for her own question","ch":4,"quote":"Not because he had her things. He didn't.","status":"paid","kids":[],"id":"p1-6-2-5"},{"title":"She remembers it at the end","ch":18,"quote":"had chosen a forest without knowing what it was.","status":"paid","kids":[],"id":"p1-6-2-6"}],"id":"p1-6-2"}],"id":"p1-6"},{"title":"Voice: practical anxieties, sharp boundaries, dry humor","note":"She worries about landlord, clothes and work; she also makes dry jokes and can be abrupt. Her body sometimes reacts before conscious explanation, but that is a variable expressive technique, not her whole identity or a rule that she cannot be witty.","kids":[{"title":"She worries about ordinary things under pressure","ch":2,"quote":"I have to get my dry cleaning before the meeting.","status":"paid","kids":[],"id":"p1-7-1"},{"title":"She takes the literal question","ch":2,"quote":"It's Thursday.","status":"paid","kids":[],"id":"p1-7-2"},{"title":"She snaps when she has to","ch":2,"quote":"\"No,\" she snapped.","status":"paid","kids":[],"id":"p1-7-3"}],"id":"p1-7"},{"title":"End: she chooses the route and asks him to join","note":"She picks an imperfect destination, checks a return route and asks Pathwell whether he wants to come. His 'Yes' is an invitation accepted; his final 'No' concerns readiness, not refusal. She leaves unresolved accountability intact rather than delivering forgiveness.","kids":[{"title":"She won't make his guilt her job","ch":16,"quote":"I need you not to make me responsible for whether you become a better person.","status":"paid","kids":[],"id":"p1-8-1"},{"title":"She doesn't know if she forgives him","ch":16,"quote":"I don't know if I forgive you.","status":"paid","kids":[],"id":"p1-8-2"},{"title":"Her ordinary life is still hers","ch":17,"quote":"It was still hers.","status":"paid","note":"The spoon. The apartment, the job, the plant.","kids":[],"id":"p1-8-3"}],"id":"p1-8"}],"id":"p1"},{"title":"Elizabeth was never the target—and still becomes essential","note":"Pathwell's first explanation misreads a cleanup threat tied to him and Shade, not Elizabeth. The corrected inference deprives her of false magical importance but not agency or belonging: she acts, chooses and affects real people's lives without becoming the prophesied key.","kids":[{"title":"Something was at her door before any magic","ch":1,"quote":"Something wet and dark sagged into the gap.","status":"paid","note":"The fair-play clue, in Chapter 1.","kids":[{"title":"She sees it through the chain","ch":1,"quote":"Something wet and dark sagged into the gap.","status":"paid","kids":[],"id":"p5-1-1"},{"title":"He calls it housekeeping","ch":1,"quote":"Just cleaning up a mess.","status":"paid","note":"Literally true.","kids":[],"id":"p5-1-2"}],"id":"p5-1"},{"title":"He decides it's after her, and tells her so","ch":1,"quote":"Your house has now been marked, magically speaking.","status":"paid","note":"A half-bluff (R27).","kids":[{"title":"He thought she'd know","ch":1,"quote":"You really don't know?","status":"paid","kids":[],"id":"p5-2-1"},{"title":"He checks the hall and goes still","ch":1,"quote":"Sticking his head out, he checked up and down the hall. Then he went still.","status":"paid","kids":[],"id":"p5-2-2"}],"id":"p5-2"},{"title":"His scavenging motive is hinted at, not confronted","ch":1,"quote":"He'd been at the party, talking to everybody.","status":"author","note":"The author-approved Chapter 1 notebook glimpse hints why Pathwell remained after Elizabeth's welcome party. Chapters 2–3 show his possession of her charged books and the Space Between trade. The specific remaining reader-effect gap is whether she and an unprimed reader connect this cause, not the complete absence of a clue. Any inserted realization is still an unapproved experiment.","kids":[{"title":"The evidence is all on the page","note":"Every piece of the answer is there. Nothing connects them.","kids":[{"title":"He was at her party","ch":1,"quote":"He'd been at the party, talking to everybody.","status":"paid","kids":[],"id":"p5-3-1-1"},{"title":"He looked at old notebooks","ch":1,"quote":"She'd seen him peering into an open box of old notebooks once","status":"paid","note":"R48's clue.","kids":[],"id":"p5-3-1-2"},{"title":"He stayed after everyone left","ch":1,"quote":"She'd thought he'd left with the rest.","status":"paid","kids":[],"id":"p5-3-1-3"},{"title":"He read her diary","ch":1,"quote":"reading her diary like a magazine in a waiting room.","status":"paid","kids":[],"id":"p5-3-1-4"},{"title":"The shop trades in people's lives","ch":3,"quote":"Not books — lives.","status":"paid","kids":[],"id":"p5-3-1-5"},{"title":"He owes the shop","ch":3,"quote":"You already owe quite a bit.","status":"paid","kids":[],"id":"p5-3-1-6"},{"title":"Her books were his stock","ch":3,"quote":"He brought outside property into an open transaction","status":"paid","kids":[],"id":"p5-3-1-7"},{"title":"Camp calls him a thief","ch":4,"quote":"I was only ever no good at being a thief.","status":"paid","kids":[],"id":"p5-3-1-8"}],"id":"p5-3-1"},{"title":"Candidate: she directly questions him in Chapter 1","ch":1,"status":"author","note":"One possible clarification, not required canon. The author's proposed sharper opening could change the reading of her existing polite boundary; test a reader response and voice consequence before accepting.","kids":[{"title":"Now: “Do you mind?” / “Not at all”","ch":1,"quote":"\"Not at all,\" he said, and turned a page.","status":"author","kids":[],"id":"p5-3-2-1"},{"title":"B0: he just turns a page","ch":1,"status":"author","note":"Recommended. Her question doesn't get his attention. The thud does.","proposed":"\"What are you still doing here?\" / He turned a page.","kids":[],"id":"p5-3-2-2"},{"title":"C0: “Reading,”","ch":1,"status":"author","note":"Funnier, but a new Pathwell joke and another dodge.","proposed":"\"What are you still doing here?\" / \"Reading,\" he said, and turned a page.","kids":[],"id":"p5-3-2-3"}],"id":"p5-3-2"},{"title":"Candidate: she connects his motive at the shop","ch":3,"status":"author","note":"A small inference at the Chapter 3 counter could connect the Chapter 1 notebook clue to his unauthorized purchase and the shopkeeper's refusal. This is proposed B1 wording, not yet on the page or author-approved.","proposed":"Elizabeth thought of Pathwell on her living-room floor, turning the pages of her diary like he was pricing it.","kids":[],"id":"p5-3-3"}],"id":"p5-3"},{"title":"Camp sees the first part doesn't fit","ch":4,"quote":"The first part did not.","status":"paid","note":"The question becomes hers.","kids":[{"title":"Mama Baga asks the timing","ch":4,"quote":"It was already at the door before you used the cookbook?","status":"paid","kids":[],"id":"p5-4-1"},{"title":"After the working, it ate the waste","ch":4,"quote":"It changed targets. Fresh waste.","status":"paid","kids":[],"id":"p5-4-2"}],"id":"p5-4"}],"id":"p5"}],"id":"g","status":"author"}};

let focusId = "g", selId = "g", filter = "all", view = "chart", editing = false, dirty = 0, artifactNs = null;

function index(){ byId = {}; parentOf = {}; (function walk(n, p){ byId[n.id] = n; if (p) parentOf[n.id] = p.id; n.kids.forEach(k => walk(k, n)); })(DATA.root, null); }
function desc(n){ let c = 0; n.kids.forEach(k => c += 1 + desc(k)); return c; }
function depthOf(n){ return n.kids.length ? 1 + Math.max(...n.kids.map(depthOf)) : 0; }
function tally(n, acc){ acc = acc || {paid:0,thin:0,open:0,author:0}; n.kids.forEach(k => { if (k.status) acc[k.status]++; tally(k, acc); }); return acc; }
function path(id){ const p = []; while (id){ p.unshift(byId[id]); id = parentOf[id]; } return p; }
function hasAuthorBelow(n){ return n.kids.some(k => k.status === "author" || hasAuthorBelow(k)); }

function stats(){ const all = tally(DATA.root); const total = 1 + desc(DATA.root);
  $("#stats").textContent = `Harada sheet · ${total} boxes · ${depthOf(DATA.root)} levels deep`; return all; }

function chips(){
  const c = tally(DATA.root); const n = c.paid + c.thin + c.open + c.author;
  const opts = [["all","All",null],["author",STATUS.author,c.author],["thin",STATUS.thin,c.thin],["open",STATUS.open,c.open],["paid",STATUS.paid,c.paid]];
  $("#chips").innerHTML = opts.map(([k,l,v]) => `<button type="button" class="chip" id="f-${k}" data-f="${k}" aria-pressed="${filter===k}">${k==="all"?"":`<span class="dot ${k}"></span>`}${esc(l)}${v === null ? "" : ` <b>${v}</b>`}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(b => b.onclick = () => { filter = b.dataset.f; chips(); render(); });
}

function crumbs(){
  const p = path(focusId);
  $("#crumbs").innerHTML = p.map((n,i) => i === p.length-1 ? `<span class="here">${esc(short(n))}</span>` : `<button type="button" data-id="${n.id}">${esc(short(n))}</button><span class="sep">›</span>`).join("");
  $("#crumbs").querySelectorAll("button").forEach(b => b.onclick = () => openBox(b.dataset.id));
}
function short(n){ return n.id === "g" ? L.center : n.title.length > 34 ? n.title.slice(0,32) + "…" : n.title; }

function cellHTML(n, kind){
  if (!n) return "";
  const dim = filter !== "all" && kind !== "focus" && n.status !== filter ? " dim" : "";
  const st = n.status ? `<span class="st dot ${n.status}" title="${STATUS[n.status]}"></span>` : "";
  const d = desc(n);
  const inside = d ? `<span class="inside">${hasAuthorBelow(n) ? '<span class="dot author"></span>' : ""}${d} inside</span>` : "";
  const ch = n.id === "g" ? L.center.toUpperCase() : n.kind === "character" ? "CHARACTER" : (n.ch ? L.source + " " + n.ch : "");
  return `<button type="button" class="cell ${kind}${n.kind === "character" ? " char" : ""} ${n.status||""}${dim}${n.id===selId?" sel":""}" data-id="${n.id}"><span class="ch">${esc(ch)}</span><span class="lbl">${esc(n.title)}</span>${st}${inside}</button>`;
}
function emptyHTML(parentId){ return editing && parentId ? `<button type="button" class="cell empty addable" data-add="${parentId}">+ Add a box</button>` : `<div class="cell empty" aria-hidden="true"></div>`; }

function renderChart(){
  const F = byId[focusId]; const blocks = [];
  for (let b = 0; b < 9; b++) blocks.push(Array(9).fill(null));
  blocks[4][4] = cellHTML(F, "focus");
  for (let i = 0; i < 8; i++){
    const c = F.kids[i], b = POS[i];
    if (c){
      blocks[4][b] = cellHTML(c, "hub");
      blocks[b][4] = cellHTML(c, "hub");
      for (let j = 0; j < 8; j++) blocks[b][POS[j]] = c.kids[j] ? cellHTML(c.kids[j], "beat") : (j === c.kids.length ? emptyHTML(c.id) : emptyHTML(null));
    } else {
      blocks[4][b] = i === F.kids.length ? emptyHTML(F.id) : emptyHTML(null);
      for (let j = 0; j < 9; j++) blocks[b][j] = emptyHTML(null);
    }
  }
  $("#sheet").innerHTML = blocks.map(cs => `<div class="block">${cs.join("")}</div>`).join("");
  $("#sheet").querySelectorAll("[data-id]").forEach(el => el.onclick = () => { const id = el.dataset.id; if (id === selId && id !== focusId) openBox(id); else select(id); });
  $("#sheet").querySelectorAll("[data-add]").forEach(el => el.onclick = () => addBox(el.dataset.add));
}

function renderOutline(){
  const g = DATA.root;
  const node = (n, lvl) => {
    const dim = filter !== "all" && n.status !== filter ? " dim" : "";
    const ch = n.ch ? L.source + " " + n.ch : "";
    const pill = n.status ? `<span class="pill ${n.status}">${STATUS[n.status]}</span>` : "<span></span>";
    const body = `${n.quote ? `<blockquote>${esc(n.quote)}</blockquote>` : ""}${n.proposed ? `<blockquote class="proposed">${esc(n.proposed)}</blockquote>` : ""}${n.note ? `<span class="note">${esc(n.note)}</span>` : ""}`;
    const d = desc(n);
    return `<details id="o-${n.id}"${lvl === 0 ? "" : ""}><summary class="${dim}"><span class="ch">${esc(ch)}</span><span class="t">${esc(n.title)}${d ? `<small>${d} inside</small>` : ""}</span>${pill}</summary><div class="body">${body}</div>${n.kids.map(k => node(k, lvl+1)).join("")}</details>`;
  };
  $("#outline").innerHTML = `<div class="goal"><span class="eyebrow" style="color:inherit;opacity:.85">${esc(L.center)}</span><b>${esc(g.title)}</b><span>${esc(g.note)}</span></div>` + g.kids.map(k => node(k, 0)).join("");
}

function panel(){
  const n = byId[selId]; if (!n) return;
  const t = tally(n); const d = desc(n);
  const meta = [n.id === "g" ? L.center : n.kind === "character" ? "Character" : (n.ch ? L.sourceName + " " + n.ch : ""), path(n.id).length - 1 ? "Level " + (path(n.id).length - 1) : ""].filter(Boolean).map(esc).join(" · ");
  let h = `<div class="meta"><span>${meta}</span>${n.status ? `<span class="pill ${n.status}">${STATUS[n.status]}</span>` : ""}</div><h2>${esc(n.title)}</h2>`;
  if (n.note) h += `<div class="how"><span class="eyebrow">${n.id === "g" ? esc(L.centerNote) : "How it gets us there"}</span><p>${esc(n.note)}</p></div>`;
  if (n.quote) h += `<div class="how"><span class="eyebrow">Evidence${n.ch ? " · " + esc(L.sourceName) + " " + esc(n.ch) : ""}</span><blockquote>${esc(n.quote)}</blockquote></div>`;
  if (n.proposed) h += `<blockquote class="proposed">${esc(n.proposed)}</blockquote>`;
  if (d) h += `<div class="tally">${Object.entries(t).filter(([,v]) => v).map(([s,v]) => `<span class="pill ${s}">${v} ${STATUS[s].toLowerCase()}</span>`).join("")}</div>`;
  h += `<div class="actions">`;
  if (n.id !== focusId && (d || editing)) h += `<button class="btn primary" id="open-box" type="button">${d ? `Open this box (${d} inside)` : "Open this box"}</button>`;
  if (parentOf[focusId] && n.id === focusId) h += `<button class="btn" id="up" type="button">Up one level</button>`;
  h += `</div>`;
  if (!d && !editing) h += `<p class="hint">Nothing inside this box yet.${artifactNs ? " Turn on Edit to break it down." : ""}</p>`;
  if (editing) h += formHTML(n);
  $("#panel").innerHTML = h;
  const ob = $("#open-box"); if (ob) ob.onclick = () => openBox(n.id);
  const up = $("#up"); if (up) up.onclick = () => openBox(parentOf[focusId]);
  if (editing) bindForm(n);
}

function formHTML(n){
  const opts = ['<option value="">No status</option>'].concat(Object.entries(STATUS).map(([k,v]) => `<option value="${k}"${n.status===k?" selected":""}>${v}</option>`)).join("");
  return `<form class="form" id="edit-form"><label>Box<input id="e-title" value="${esc(n.title)}" required></label>
  <div class="row2"><label>${esc(L.sourceName)}<input id="e-ch" value="${esc(n.ch ?? "")}"></label><label>Status<select id="e-status">${opts}</select></label></div>
  <label>Quote (exact words from the source)<textarea id="e-quote">${esc(n.quote)}</textarea></label>
  <label>Proposed wording (not in the source yet)<textarea id="e-proposed">${esc(n.proposed)}</textarea></label>
  <label>Note<textarea id="e-note">${esc(n.note)}</textarea></label>
  <div class="actions"><button class="btn primary" type="submit">Apply</button>${n.id !== "g" ? `<button class="btn danger" type="button" id="e-del"${n.kids.length ? " disabled" : ""}>Delete box</button>` : ""}</div>
  ${n.kids.length && n.id !== "g" ? '<p class="hint">Delete the boxes inside it first.</p>' : ""}</form>`;
}
function bindForm(n){
  $("#edit-form").onsubmit = e => { e.preventDefault();
    const v = id => $(id).value.trim();
    n.title = v("#e-title") || n.title;
    const chv = v("#e-ch"); if (!chv) delete n.ch; else n.ch = /^\d+$/.test(chv) ? parseInt(chv, 10) : chv;
    ["quote","proposed","note"].forEach(k => { const x = v("#e-" + k); if (x) n[k] = x; else delete n[k]; });
    const s = v("#e-status"); if (s) n.status = s; else delete n.status;
    markDirty(); render(); };
  const del = $("#e-del"); if (del) del.onclick = () => { if (n.kids.length) return; const p = byId[parentOf[n.id]]; p.kids = p.kids.filter(k => k !== n); index(); selId = p.id; if (focusId === n.id) focusId = p.id; markDirty(); render(); };
}
function addBox(parentId){
  const p = byId[parentId]; if (p.kids.length >= 8) return;
  let i = p.kids.length + 1, id; do { id = (parentId === "g" ? "p" : parentId + "-") + i++; } while (byId[id]);
  p.kids.push({id, title: "New box", kids: []}); index(); selId = id; markDirty(); render();
  const t = $("#e-title"); if (t){ t.focus(); t.select(); }
}
function markDirty(){ dirty++; const s = $("#save"); s.disabled = false; s.textContent = `Save to page (${dirty})`; }

function safe(s){ return s.replace(/</g, "\\u003c").replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029"); }
function buildDoc(){
  const head = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>';
  const strip = n => ({...n, kids: n.kids.map(strip)});
  const data = {...DATA, root: strip(DATA.root)};
  const content = TEMPLATE.replace(/__(DATA|TEMPLATE|TITLE)__/g, (m, k) => k === "DATA" ? safe(JSON.stringify(data)) : k === "TITLE" ? esc(DATA.title || "Harada chart") : safe(JSON.stringify(TEMPLATE)));
  return head + content + "</body></html>";
}
async function save(){
  const btn = $("#save"), msg = $("#save-msg"); btn.disabled = true; btn.textContent = "Saving…";
  try { await artifactNs.publish(buildDoc()); msg.hidden = false; msg.className = "notice"; msg.textContent = "Saved. The page is reloading to the new version."; }
  catch (e) {
    const code = e && (e.code || e.name) || "";
    msg.hidden = false; msg.className = "notice err";
    msg.textContent = code === "conflict" ? "Someone saved a newer version first, so these changes weren't kept. The page is reloading to theirs."
      : (code === "not_granted" || code === "not_writer") ? "This page can't be saved from your view. Only people who can edit it can save changes."
      : "The save didn't go through. Your changes are still here; try Save again.";
    btn.disabled = false; btn.textContent = `Save to page (${dirty})`;
  }
}

function select(id){ selId = id; render(); }
function openBox(id){ focusId = id; selId = id; try { history.replaceState(null, "", "#" + id); } catch(e){} render(); }
function render(){ crumbs(); stats(); if (view === "chart") renderChart(); else renderOutline(); panel(); }
function setView(v){ view = v; $("#v-chart").setAttribute("aria-pressed", v === "chart"); $("#v-list").setAttribute("aria-pressed", v === "list"); $("#board").hidden = v !== "chart"; $("#outline").hidden = v !== "list"; render(); try { localStorage.setItem("harada-view:" + (DATA.title || ""), v); } catch(e){} }
$("#v-chart").onclick = () => setView("chart"); $("#v-list").onclick = () => setView("list");
$("#edit-toggle").onclick = () => { editing = !editing; $("#edit-toggle").setAttribute("aria-pressed", editing); $("#edit-toggle").textContent = editing ? "Done editing" : "Edit"; $("#save").hidden = !editing && !dirty; render(); };
$("#save").onclick = save;
$("#title").textContent = DATA.title || "Harada chart"; $("#lede").textContent = DATA.lede || L.lede; $("#footer").textContent = DATA.footer || "";
if (!(DATA.loose || []).length) $("#loose-wrap").hidden = true;
$("#loose").innerHTML = (DATA.loose || []).map(l => `<li><span class="id"><span class="dot ${l.status}"></span>${esc(l.id)}</span><span>${esc(l.text)}</span></li>`).join("");

index(); chips();
const h = (location.hash || "").slice(1);
if (h && byId[h]) { selId = h; focusId = byId[h].kids.length ? h : (parentOf[h] || "g"); }
let start = window.matchMedia("(max-width: 720px)").matches ? "list" : "chart";
try { const s = localStorage.getItem("harada-view:" + (DATA.title || "")); if (s === "chart" || s === "list") start = s; } catch(e){}
setView(start);
(async () => { try { const ns = await window.claude?.use?.("artifact"); if (ns) { artifactNs = ns; $("#edit-toggle").hidden = false; render(); } } catch(e){} })();
</script>
</body></html>
